<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kart Savaşı">
<meta name="theme-color" content="#050403">
<link rel="apple-touch-icon" href="ikon_180.png">
<link rel="manifest" href="manifest.json">
<title>Kıyametin Çocukları – Kart Savaşı</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24a;--gold2:#f3d98a;--gdim:#7d6634;--text:#e9dfc9;--muted:#8f826c;--bg:#0b0907;
  --sa:#ff6b5e;--ha:#c48bff;--zs:#f2d14b;--cn:#6fe07a;--cw:56px;--ch:78px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050403;color:var(--text);font-family:Inter,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{width:450px;height:800px;position:relative;flex:none;transform-origin:center;overflow:hidden;border-radius:14px;border:2px solid var(--gdim);background:var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
h1,h2,h3,.cz{font-family:Cinzel,serif}
button{font-family:Cinzel,serif;cursor:pointer;border:none;color:var(--text)}
.btn{background:linear-gradient(180deg,#3a2c18,#22190e);border:1.5px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;filter:grayscale(1)}
.btn.iyi{border-color:#e6c76a;background:linear-gradient(180deg,#3c3420,#1f2a3c)}
.btn.kotu{border-color:#b04a3a;background:linear-gradient(180deg,#3c1a14,#1a0b08)}
.btn.sm{padding:5px 9px;font-size:11px}
.gold{position:absolute;top:10px;right:12px;z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,8,5,.75);border:1px solid var(--gold);border-radius:20px;padding:4px 12px 4px 6px;font-family:Cinzel,serif;font-weight:700;color:var(--gold2);font-size:15px}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e2b33a 45%,#8a5e10);box-shadow:0 0 6px #e2b33a}
.topnav{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;border-bottom:1px solid rgba(201,162,74,.3);background:rgba(10,8,5,.85)}
.topnav h2{font-size:17px;color:var(--gold2)}
.tabs{display:flex;gap:6px;padding:8px 12px;flex:none}
.tab{flex:1;padding:7px;border-radius:7px;border:1px solid var(--gdim);background:#16110b;font-size:12px;font-weight:700}
.tab.on{border-color:var(--gold2);background:#3a2c18;color:var(--gold2)}
.tab.iyi.on{border-color:#e6c76a} .tab.kotu.on{border-color:#d0604a;background:#3a1610;color:#ffb4a4}

/* ANA MENÜ */
#menu{background:url(menu_bg.jpg) center/cover}
#menu::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,3,.2) 0%,rgba(5,4,3,.1) 35%,rgba(5,4,3,.75) 70%,rgba(5,4,3,.95) 100%)}
.title{position:relative;margin-top:96px;text-align:center}
.title .t1{font-family:Cinzel,serif;font-weight:900;font-size:34px;letter-spacing:3px;color:var(--gold2);text-shadow:0 2px 0 #3a2a0c,0 0 24px rgba(0,0,0,.9)}
.title .t2{font-family:Cinzel,serif;font-size:13px;letter-spacing:6px;color:#d8c9a6;margin-top:6px;text-shadow:0 0 10px #000}
.title .beta{display:inline-block;margin-top:8px;font-size:10px;padding:2px 8px;border:1px solid var(--gold);border-radius:3px;color:var(--gold);letter-spacing:2px}
.menulist{position:relative;margin-top:auto;margin-bottom:46px;display:flex;flex-direction:column;gap:12px;padding:0 60px}
.menulist .btn{font-size:17px;padding:13px}
.submenu{display:flex;gap:10px}
.submenu .btn{flex:1}

/* KART GÖRÜNÜMÜ */
.kart{width:var(--cw);height:var(--ch);border-radius:6px;border:1.5px solid var(--gold);position:relative;overflow:hidden;
  background:#2a2017 center 20%/cover;display:flex;flex-direction:column;justify-content:flex-end;flex:none;color:var(--text)}
.kart.kotu{border-color:#b56a5a}
.kart.ph.iyi{background:radial-gradient(circle at 50% 35%,#4b3c22,#1b150c)}
.kart.ph.kotu{background:radial-gradient(circle at 50% 35%,#5a1712,#140504 80%)}
.kart.ph .rune{position:absolute;top:22%;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:26px;color:rgba(255,120,90,.55);text-shadow:0 0 12px rgba(255,60,30,.6)}
.kart .nm{font-size:7.3px;background:rgba(0,0,0,.62);text-align:center;padding:2px 1px;line-height:1.12}
.kart .st{display:flex;background:rgba(0,0,0,.78);padding:1px 0 2px}
.kart .st b{flex:1;text-align:center;font-family:Cinzel,serif;font-size:8.5px;font-weight:700;line-height:1.25}
.sa{color:var(--sa)}.ha{color:var(--ha)}.zs{color:var(--zs)}.cn{color:var(--cn)}
.kart .st b.up{background:rgba(111,224,122,.22)} .kart .st b.dn{background:rgba(255,80,60,.28)}
.kart .st b.cn.hurt{color:#ffb070}
.kart.efs{border:2px solid #ffd86a;animation:efs 2.4s ease-in-out infinite}
@keyframes efs{0%,100%{box-shadow:0 0 5px rgba(255,216,106,.5)}50%{box-shadow:0 0 14px rgba(255,226,140,.95)}}
.kart .el{position:absolute;top:3px;right:3px;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.6)}
.el.ates{background:radial-gradient(circle at 50% 65%,#ffd36b 0 25%,#ff7a1a 45%,#b8220c 80%);box-shadow:0 0 6px #ff6a1a}
.el.yildirim{background:radial-gradient(circle,#fff 0 18%,#9fc3ff 38%,#3d5bff 70%,#141a5a);box-shadow:0 0 6px #7aa8ff}
.el.asit{background:radial-gradient(circle at 45% 40%,#f4ffb0 0 15%,#a8f02a 40%,#4f8f0c 75%,#1d3604);box-shadow:0 0 6px #9de52a}
.el.zehir{background:radial-gradient(circle at 45% 40%,#e7c8ff 0 14%,#a24ee0 40%,#5a1a8c 75%,#220736);box-shadow:0 0 6px #b066ff}
.el.su{background:radial-gradient(circle at 40% 35%,#e8fbff 0 14%,#6fd0ff 40%,#1f78c8 72%,#0a2a55);box-shadow:0 0 6px #5cc8ff}
.el.isik{background:radial-gradient(circle,#fff 0 22%,#fff1b0 45%,#f0b93a 75%,#7a4e08);box-shadow:0 0 7px #ffe27a}
.el.sifa{background:radial-gradient(circle,#fff 0 16%,#c9ffd2 38%,#3fbf6a 70%,#0f4a22);box-shadow:0 0 6px #7dffa0}
.el.mucize{background:radial-gradient(circle,#fff 0 20%,#ffe9a6 42%,#e0a92a 72%,#5a3a04);box-shadow:0 0 8px #ffd86a}
.el.duman{background:radial-gradient(circle at 45% 40%,#eee 0 14%,#9a9aa6 45%,#4a4a55 80%,#1a1a20);box-shadow:0 0 6px #aaa}
.el.coklu{background:conic-gradient(#ff7a1a,#6fd0ff,#a8f02a,#b066ff,#fff1b0,#3d5bff,#ff7a1a);box-shadow:0 0 7px #fff}
.el.ozel{background:radial-gradient(circle,#ffd0f0 0 15%,#c04ab0 50%,#3a0a35);box-shadow:0 0 6px #e070d0}
.kart .irk{position:absolute;top:2px;left:2px;font-size:5.5px;letter-spacing:.3px;background:rgba(0,0,0,.65);padding:1px 2px;border-radius:2px;color:#e0c8a0;font-family:Inter}
.kart.mini{border:2px solid #c070ff;box-shadow:0 0 8px rgba(192,112,255,.6)}
.sts .duman{background:#bbb}.sts .kalkan{background:#9db8ff}
.el.dua{background:radial-gradient(circle at 50% 45%,#f2f6ff 0 15%,#9db8ff 40%,#3b55c9 72%,#101c52);box-shadow:0 0 6px #8fb0ff}
.kart .bigtxt{position:absolute;top:30%;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:13px;text-shadow:0 0 6px #000,0 0 3px #000}
.kart .tag{position:absolute;top:2px;left:2px;font-size:6px;letter-spacing:.5px;background:rgba(0,0,0,.6);padding:1px 3px;border-radius:2px;color:var(--gold2);font-family:Inter}
.kart .sts{position:absolute;top:2px;left:2px;display:flex;gap:1px;flex-wrap:wrap;width:40px}
.kart .sts i{font-style:normal;font-size:7px;font-weight:700;min-width:11px;height:11px;line-height:11px;text-align:center;border-radius:3px;color:#111}
.sts .asit{background:#a8f02a}.sts .zehir{background:#b066ff;color:#fff}.sts .yanma{background:#ff8a3a}.sts .islak{background:#6fd0ff}
.kart .cdd{position:absolute;right:2px;top:17px;font-size:7px;background:rgba(0,0,0,.7);border-radius:3px;padding:0 2px;color:#ccc}
.kart.can-act{box-shadow:0 0 0 2px rgba(111,224,122,.75),0 0 10px rgba(111,224,122,.5)}
.kart.secili{box-shadow:0 0 0 2px #fff,0 0 16px #f3d98a!important;transform:translateY(-3px)}
.kart.hedef{box-shadow:0 0 0 2px #ff5a4a,0 0 14px rgba(255,90,74,.9)!important;cursor:crosshair;animation:hdf 1s infinite}
@keyframes hdf{50%{box-shadow:0 0 0 2px #ff9a8a,0 0 20px rgba(255,90,74,1)}}
.kart.dost-hedef{box-shadow:0 0 0 2px #6fe07a,0 0 14px rgba(111,224,122,.9)!important;cursor:pointer}
.kart.sarsil{animation:sars .35s}
@keyframes sars{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

/* OYUN EKRANI */
#oyun{background:#14100b}
#oyun .ground{position:absolute;inset:0;background:center/cover;transition:background-image .6s}
#oyun .ground::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,8,6,.3),rgba(10,8,6,.62) 70%,rgba(10,8,6,.9))}
.gtop{position:relative;z-index:2;height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:rgba(8,6,4,.78);border-bottom:1px solid rgba(201,162,74,.3)}
.gtop .rk{font-size:9px;color:var(--muted);white-space:nowrap}
.gtop .rk b{color:#ffb4a4;font-family:Cinzel}
.pips{display:flex;gap:4px;align-items:center;margin:0 auto;font-family:Cinzel,serif;font-size:9px;color:var(--muted);white-space:nowrap}
.pip{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);background:#1a140c}
.pip.on{background:radial-gradient(circle,#fff3b0,#e2b33a);box-shadow:0 0 6px #e2b33a}
.pip.o.on{background:radial-gradient(circle,#ffc0b0,#d04a3a);box-shadow:0 0 6px #d04a3a;border-color:#d04a3a}
.mute{width:26px;height:24px;border-radius:5px;background:#1d160e;border:1px solid var(--gdim);font-size:12px;display:flex;align-items:center;justify-content:center;font-family:Inter}
.mute.off{opacity:.45;text-decoration:line-through;border-color:#5a2a20}
.side{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;padding:3px 0;flex:none}
.row{display:flex;justify-content:center;gap:6px;align-items:center}
.col{width:var(--cw);height:var(--ch);flex:none;position:relative}
.lane{display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(24,19,14,.55);border:1px solid rgba(201,162,74,.25);position:relative}
.me .lane{border-left:3px solid #3d6b8a}.foe .lane{border-left:3px solid #8a3d3d}
.lane .lbl{position:absolute;left:6px;top:-1px;font-family:Cinzel,serif;font-size:7px;letter-spacing:1px;color:var(--gdim);pointer-events:none;z-index:3}
.slot{width:var(--cw);height:var(--ch);border:1px dashed rgba(233,223,201,.22);border-radius:6px;background:rgba(0,0,0,.18);flex:none}
.slot.hedef-ok,.mod.hedef-ok,.zslot.hedef-ok{border:1.5px solid var(--gold2);background:rgba(243,217,138,.18);box-shadow:inset 0 0 12px rgba(243,217,138,.35);animation:ok 1.1s infinite}
@keyframes ok{50%{background:rgba(243,217,138,.32)}}
.slot.ust{background:rgba(243,217,138,.45)!important}
.mod{width:var(--cw);height:var(--ch);border:1px dashed rgba(233,223,201,.22);border-radius:6px;background:rgba(14,11,8,.45);display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.mod .kart.bf-iyi{border-color:#6fe07a;box-shadow:0 0 8px rgba(111,224,122,.55)}
.mod .kart.bf-kotu{border-color:#e06060;box-shadow:0 0 8px rgba(224,96,96,.55)}
.pile{width:var(--cw);height:var(--ch);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.pile .n{font-family:Cinzel,serif;font-weight:700;font-size:18px;line-height:1}
.grave{background:#151110;border:1.5px solid #4a4038;color:var(--muted)}
.grave.vurgu{animation:mzr .6s}
@keyframes mzr{40%{box-shadow:0 0 16px rgba(255,80,60,.9)}}
.deck{background:center/cover;border:2px solid var(--gold);box-shadow:3px 3px 0 #1a140d}
.deck .n,.deck .l{background:rgba(0,0,0,.72);padding:0 5px;border-radius:3px;color:var(--gold2)}
.mid{position:relative;z-index:3;height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 74px}
.mid .faz{flex:1;font-family:Cinzel,serif;font-size:10.5px;color:var(--gold2);text-align:center;line-height:1.25;text-shadow:0 0 6px #000}
.mid .faz small{display:block;font-family:Inter;font-size:9px;color:#cbbf9f}
.mid .tmr{font-family:Cinzel,serif;font-weight:900;font-size:16px;color:var(--gold2);width:30px;text-align:center}
.mid .tmr.az{color:#ff6b5e;animation:hdf 1s infinite}
.zslot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:var(--cw);height:var(--ch);border-radius:6px;z-index:4}
.zslot .cap{position:absolute;top:-11px;left:0;right:0;text-align:center;font-family:Cinzel;font-size:7px;letter-spacing:1px;color:var(--gold)}
.hand{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;gap:6px;padding:0 8px 8px;min-height:0}
.handwrap{flex:1;height:118px;position:relative;overflow-x:auto;overflow-y:visible;scrollbar-width:none;touch-action:pan-x}
.handwrap::-webkit-scrollbar{display:none}
.handrow{display:flex;align-items:flex-end;height:100%;padding:34px 6px 2px;width:max-content;min-width:100%;justify-content:center}
.handrow .kart{margin-left:-14px;transition:transform .12s;cursor:pointer;touch-action:none}
.handrow .kart:first-child{margin-left:0}
.handrow .kart.secili{transform:translateY(-32px);z-index:5}
.handrow .kart.pasif{filter:brightness(.55)}
.hside{display:flex;flex-direction:column;gap:6px;align-items:center;padding-bottom:4px}
.ghost{position:absolute;z-index:90;pointer-events:none;opacity:.92;transform:translate(-50%,-60%) rotate(-3deg) scale(1.1);box-shadow:0 12px 26px rgba(0,0,0,.8),0 0 0 2px var(--gold2)}
.float{position:absolute;z-index:80;pointer-events:none;font-family:Cinzel,serif;font-weight:900;font-size:16px;text-shadow:0 0 4px #000,0 0 2px #000;animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{transform:translate(-50%,0) scale(1.3);opacity:1}100%{transform:translate(-50%,-34px) scale(1);opacity:0}}
.actbar{position:absolute;left:50%;transform:translateX(-50%);top:-34px;display:flex;gap:6px;z-index:20}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:95;background:rgba(10,8,5,.92);border:1.5px solid var(--gold);border-radius:10px;padding:12px 20px;font-family:Cinzel,serif;font-size:17px;color:var(--gold2);text-align:center;pointer-events:none;animation:tst 1.6s forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}

/* ÖNİZLEME / MODAL */
.modal{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#15100a;border:1.5px solid var(--gold);border-radius:12px;padding:16px;max-width:100%;max-height:100%;overflow:auto;text-align:center}
.mbox h3{color:var(--gold2);margin-bottom:10px;font-size:17px}
.mbox p{font-size:12.5px;line-height:1.5;color:#d8ccb0;margin-bottom:12px}
.prev{display:flex;gap:10px;align-items:center}
.prev .kart{--cw:150px;--ch:210px;border-radius:10px;border-width:2.5px}
.prev .kart .nm{font-size:13px;padding:4px}
.prev .kart .st b{font-size:17px}
.prev .kart .el{width:24px;height:24px;top:6px;right:6px}
.prev .kart .rune{font-size:60px}
.prev .kart .bigtxt{font-size:22px}
.prev .info{width:160px;text-align:left;font-size:11px;line-height:1.5;background:#0e0b07;border:1px solid var(--gold);border-radius:8px;padding:9px 10px}
.prev .info h4{font-family:Cinzel,serif;color:var(--gold2);font-size:13px}
.prev .info .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.prev .info .d{margin-top:6px;color:#b9ad95;font-style:italic}
.efsb{display:inline-block;margin-bottom:4px;padding:1px 6px;border-radius:3px;background:linear-gradient(90deg,#8a5a08,#e6b23a,#8a5a08);color:#1a1004;font-family:Cinzel,serif;font-size:9px;font-weight:700;letter-spacing:1px}
#onizle{position:absolute;z-index:60;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;display:none}
#onizle.on{display:block}
.glist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:380px}

/* LİSTE EKRANLARI */
.liste{flex:1;overflow-y:auto;padding:6px 10px 14px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.cell .kart{--cw:74px;--ch:104px}
.cell .kart .nm{font-size:8.5px}.cell .kart .st b{font-size:10px}
.cell .adet{position:absolute;top:-4px;right:-2px;z-index:3;background:#c9a24a;color:#1a1004;font-family:Cinzel;font-weight:900;font-size:10px;border-radius:9px;padding:1px 6px;box-shadow:0 0 4px #000}
.cell .adet.z{background:#444;color:#ccc}
.cell .fiyat{font-size:10px;display:flex;align-items:center;gap:3px;font-family:Cinzel;font-weight:700;color:var(--gold2)}
.cell .fiyat .coin{width:12px;height:12px}
.cell button.al{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--gold);background:#2a2012}
.cell button.al:disabled{opacity:.35}
.cell.soluk .kart{filter:grayscale(.8) brightness(.55)}
.bolum{font-family:Cinzel,serif;font-size:12px;color:var(--gold);margin:10px 2px 6px;display:flex;align-items:center;gap:8px}
.bolum::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gdim),transparent)}
.uyari{font-size:11px;color:#ffb4a4;text-align:center;padding:4px}
.ok{color:#9fe09a}
.ayar{padding:16px 22px;display:flex;flex-direction:column;gap:22px}
.ayar .s{display:flex;align-items:center;gap:12px}
.ayar .s label{width:96px;font-family:Cinzel;font-size:14px;color:var(--gold2)}
.ayar input[type=range]{flex:1;accent-color:#c9a24a}
.ayar .val{width:34px;text-align:right;font-size:12px;color:var(--muted)}
.karmasec{flex:1;display:flex;flex-direction:column;gap:16px;padding:30px 34px;justify-content:center}
.karmasec .btn{padding:20px;font-size:22px;display:flex;flex-direction:column;gap:6px;align-items:center}
.karmasec .btn small{font-family:Inter;font-size:11px;font-weight:400;letter-spacing:0;color:#d8ccb0}
.sonuc{text-align:center}
.sonuc .bas{font-family:Cinzel;font-weight:900;font-size:34px;margin:6px 0 10px}

<script>
// ===================== VERİ =====================
const A=p=>(window.ASSET&&window.ASSET[p])||p;
// ===================== DİL =====================
const DILLER=[['tr','Türkçe'],['en','English'],['zh','中文'],['fr','Français'],['de','Deutsch'],['ar','العربية'],['ru','Русский'],['es','Español'],['it','Italiano'],['ja','日本語'],['ko','한국어'],['sv','Svenska']];
window.CEVIRI=window.CEVIRI||{};
let dil='tr';
const CVK={}; window.CV_EKSIK=null;
const HARF=/[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû]/;
function cv(s){ if(dil==='tr'||!s||!HARF.test(s)) return s; const D=CEVIRI[dil]; if(!D&&!window.CV_EKSIK) return s;
  const c=CVK[dil]||(CVK[dil]=new Map()); if(c.has(s)) return c.get(s); const r=cv0(s,D||{}); c.set(s,r); return r; }
function cv0(s,D){
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const a=m[1],core=m[2],b=m[3]; if(!core||!HARF.test(core)) return s;
  if(D[core]!=null) return a+D[core]+b;
  const nums=[]; const norm=core.replace(/\d+/g,x=>{nums.push(x);return '{n}';});
  if(nums.length&&D[norm]!=null){ let i=0; return a+D[norm].replace(/\{n\}/g,()=>nums[i++]??'')+b; }
  for(const sep of [' · ',' ➜ ',' — ',' – ',': ',' / ',' | ']){ if(core.includes(sep)) return a+core.split(sep).map(p=>cv0(p,D)).join(sep)+b; }
  const mm=core.match(/^([\s\S]*?[A-Za-zÇĞİÖŞÜçğıöşü0-9)\]}])([^A-Za-zÇĞİÖŞÜçğıöşü0-9)\]}]+)$/); if(mm&&mm[1]&&HARF.test(mm[1])&&D[mm[1]]!=null) return a+D[mm[1]]+mm[2]+b;
  const lead=core.match(/^([^A-Za-zÇĞİÖŞÜçğıöşü{]+)([\s\S]+)$/); if(lead){ const r=cv0(lead[2],D); if(r!==lead[2]) return a+lead[1]+r+b; }
  const parts=core.split(/(?<=[.!?…])\s+/); if(parts.length>1) return a+parts.map(p=>cv0(p,D)).join(' ')+b;
  if(mm&&mm[1]&&HARF.test(mm[1])&&mm[1]!==core){ const r=cv0(mm[1],D); if(r!==mm[1]) return a+r+mm[2]+b; }
  if(window.CV_EKSIK) window.CV_EKSIK.add(nums.length?norm:core);
  return s;
}
// zengin (HTML) metinler: tam anahtarla çevrilir

const DEF={}; DATA.forEach(d=>DEF[d.id]=d);
const ROWS=['piyade','okcu','buyucu'], ROWAD={piyade:'Piyade',okcu:'Okçu',buyucu:'Büyücü'};

const tbid=id=>(DEF[id]&&DEF[id].base)||id;
function varyant(key){
  if(DEF[key]) return DEF[key];

  const [a,h,z,c]=ek.split('.').map(Number);

  DEF[key]=d; return d;
}
function varyantlariKaydet(){ Object.keys(S.inv).forEach(k=>{ if(k.includes('@')) varyant(k); }); ['iyi','kotu'].forEach(k=>S.decks[k].forEach(id=>{ if(id.includes('@')) varyant(id); })); }

const karis=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};

// başlangıç: efsaneviler hariç, fiyat sırasıyla 3 dilim → 10 zayıf, 5 orta, 5 güçlü; aynı karttan en fazla 3
function baslangic(k){
  const pool=DATA.filter(d=>d.karma===k&&!d.efs&&!d.mini&&!d.cagrilan&&!d.ozel&&d.tur!=='zemin').sort((a,b)=>a.fiyat-b.fiyat);
  const n=pool.length,t1=Math.ceil(n/3),t2=Math.ceil(2*n/3);
  const out=[],say={};
  const sec=(arr,c)=>{let g=0;while(c>0&&g<500){g++;const d=arr[rnd(arr.length)];if((say[d.id]||0)<3){say[d.id]=(say[d.id]||0)+1;out.push(d.id);c--;}}};
  sec(pool.slice(0,t1),10); sec(pool.slice(t1,t2),5); sec(pool.slice(t2),5);
  return out;
}

function solar(a,hedef,ms,bitti){ const bas=a.volume, t0=performance.now(); const f=()=>{ const k=Math.min(1,(performance.now()-t0)/ms); a.volume=Math.max(0,Math.min(1,bas+(hedef-bas)*k)); if(k<1) requestAnimationFrame(f); else if(bitti) bitti(); }; requestAnimationFrame(f); }
function muzikCal(h,zorla){
  if(!ilkSes){ muzH=h; return; }
  if(muzH===h&&muzA&&!zorla) return; muzH=h;
  const L=MUZ[h]; let i=rnd(L.length); if(L.length>1&&L[i]===muzSon[h]) i=(i+1)%L.length; muzSon[h]=L[i];
  const a=new Audio(A('ses/muzik/'+L[i]+'.mp3')); a.volume=0; a.loop=L.length===1;
  a.onended=()=>{ if(muzA===a) muzikCal(muzH,true); };
  const eski=muzA; muzA=a; a.play().then(()=>{ sesEngel=false; }).catch(()=>{ sesEngel=true; }); solar(a,muzVol(),1800);
  if(eski) solar(eski,0,1500,()=>{ eski.pause(); eski.src=''; });
}

}

let konA=null,sonKon={};
function konusDosya(ad,bekle,oncelik){
  try{ if(S.ses.mKonusma) return false; const t=Date.now();
    if(bekle&&sonKon[ad]&&t-sonKon[ad]<bekle) return false;
    if(konA&&!konA.ended&&!konA.paused){ if(!oncelik) return false; konA.pause(); }
    sonKon[ad]=t; const a=new Audio(A('ses/konusma/'+ad+'.mp3')); a.volume=Math.min(1,S.ses.konusma); konA=a;
    if(muzA&&!S.ses.mMuzik){ const mv=muzVol(); solar(muzA,mv*.45,250); a.onended=()=>{ if(muzA) solar(muzA,muzVol(),700); }; }
    a.play().catch(()=>{}); return true; }catch(e){ return false; }
}

function seslendir(side,olay){

function sesUygula(){
  try{ if(muzA) muzA.volume=muzVol(); if(konA&&S.ses.mKonusma) konA.pause(); }catch(e){}
  ['mEfekt','mMuzik','mKonusma'].forEach(m=>{const b=document.getElementById(m); if(b) b.classList.toggle('off',S.ses[m]);});
  if(!AC) return;
  gFx.gain.value=S.ses.mEfekt?0:S.ses.efekt;
  gMu.gain.value=S.ses.mMuzik?0:S.ses.muzik*0.5;
  ['mEfekt','mMuzik','mKonusma'].forEach(m=>{const b=document.getElementById(m); if(b) b.classList.toggle('off',S.ses[m]);});
}
function ton(f,t0,dur,tip,vol,f2){
  const o=AC.createOscillator(),g=AC.createGain(); o.type=tip||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||.3,t0+.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(gFx); o.start(t0); o.stop(t0+dur+.05);
}
function gurultu(t0,dur,vol,fq){
  const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=fq||1200; g.gain.value=vol||.4;
  s.connect(f); f.connect(g); g.connect(gFx); s.start(t0);
}
function sfx(n){
  if(S.ses.mEfekt) return;
  if(FXDOSYA[n]&&n!=='hover'){ fxCal(FXDOSYA[n],n==='debuff'?.8:1); return; }
  if(!AC) return; const t=AC.currentTime;
  if(n==='koy'){ gurultu(t,.12,.5,900); ton(180,t,.15,'triangle',.25,90); }
  else if(n==='vur'){ gurultu(t,.18,.7,2200); ton(140,t,.2,'sawtooth',.18,60); }
  else if(n==='blok'){ ton(900,t,.25,'square',.08,700); ton(1350,t,.2,'triangle',.08); }
  else if(n==='olum'){ ton(220,t,.6,'sawtooth',.18,50); gurultu(t,.4,.3,400); }
  else if(n==='buff'){ [523,659,784].forEach((f,i)=>ton(f,t+i*.07,.3,'triangle',.15)); }
  else if(n==='debuff'){ [392,330,262].forEach((f,i)=>ton(f,t+i*.07,.3,'sawtooth',.1)); }
  else if(n==='tik'){ ton(1200,t,.05,'square',.05); }
  else if(n==='zafer'){ [523,659,784,1046].forEach((f,i)=>ton(f,t+i*.15,.5,'triangle',.2)); }
  else if(n==='yenilgi'){ [392,349,311,262].forEach((f,i)=>ton(f,t+i*.2,.6,'sawtooth',.12)); }
  else if(n==='sifa'){ [660,880,990].forEach((f,i)=>ton(f,t+i*.06,.4,'sine',.15)); }
  else if(n==='zemin'){ gurultu(t,.6,.35,300); ton(110,t,.6,'sine',.25,70); }
}
function muzikBaslatEski(){
  // karanlık, yavaş bir arka plan: dron + minör arpej
  const nota=[57,60,64,62,57,60,65,64, 55,59,62,60,57,60,64,69];
  let i=0; const mf=m=>440*Math.pow(2,(m-69)/12);
  const dr=AC.createOscillator(),dg=AC.createGain(),lp=AC.createBiquadFilter(); dr.type='sawtooth'; dr.frequency.value=mf(33);
  lp.type='lowpass'; lp.frequency.value=220; dg.gain.value=.12; dr.connect(lp); lp.connect(dg); dg.connect(gMu); dr.start();
  muTimer=setInterval(()=>{ if(!AC) return; const t=AC.currentTime, f=mf(nota[i%nota.length]);
    const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(); o.type='triangle'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.05); g.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
    o.connect(fl); fl.connect(g); g.connect(gMu); o.start(t); o.stop(t+1.4); i++; },620);
}

function rastYildiz(id,n){ if(!n) return id; const e={sa:0,ha:0,zs:0,cn:0}, ks=['sa','ha','zs','cn']; for(let j=0;j<n;j++) e[ks[rnd(4)]]++; return varyant(id+'@'+[e.sa,e.ha,e.zs,e.cn].join('.')).id; }
function haritaDeste(k,i){
  const d=HARITA[k][i], ok=k==='iyi'?'kotu':'iyi', L=i+1;
  let havuz=d.havuz==='tum'?tumKarakter(ok):[].concat(d.havuz).flatMap(x=>HV[x]);
  havuz=havuz.filter(id=>DEF[id]);
  const boyut=20+Math.min(8,Math.floor(L/3)), out=[];
  // zeminler serbest
  const zem=DATA.filter(z=>z.tur==='zemin'&&z.id!=='z_toprak'&&!(d.zy||[]).includes(z.id)).map(z=>z.id);
  const zSay=1+Math.min(2,Math.floor(L/6)); for(let j=0;j<zSay;j++) out.push((d.zt&&Math.random()<.7)?d.zt[rnd(d.zt.length)]:zem[rnd(zem.length)]);
  // buff / debuff (basit + izin verilen seviyeler)
  const bTemel=DATA.filter(x=>x.karma===ok&&x.tur==='buff'&&!x.efs&&!x.seviyeli).map(x=>x.id);
  const bSay=2+Math.min(3,Math.floor(L/5)); for(let j=0;j<bSay;j++){ const t=bTemel[rnd(bTemel.length)], sv=1+rnd(d.b); out.push(sv>1&&DEF[t+'_'+sv]?t+'_'+sv:t); }
  if(L>=6){ const sil=DATA.filter(x=>x.karma===ok&&(x.tur==='kaldir'||x.tur==='temizle')).map(x=>x.id); if(sil.length) out.push(sil[rnd(sil.length)]); }
  // direnç / bağışıklık
  if(d.kr){ const kor=DATA.filter(x=>x.tur==='koruma'&&(d.kr>=2||x.kor.tip==='direnc')).map(x=>x.id); const n=d.kr>=2?2:1; for(let j=0;j<n;j++) out.push(kor[rnd(kor.length)]); }
  // efsaneviler / minibosslar
  (d.efs||[]).forEach(e=>{ if(DEF[e]) out.push(e); });
  if(d.efsSay){ const ef=karis(DATA.filter(x=>x.karma===ok&&x.efs&&KARAKTER(x.tur)&&!x.ozel&&x.id!==d.boss).map(x=>x.id)).slice(0,d.efsSay); out.push(...ef); }
  if(d.mini){ out.push(...karis(DATA.filter(x=>x.karma===ok&&x.mini).map(x=>x.id)).slice(0,d.mini)); }
  // savaşçılar (yıldız sınırına kadar birleştirilmiş)
  while(out.length<boyut){ const id=havuz[rnd(havuz.length)]; const y=d.y?Math.min(d.y,Math.round(Math.random()*d.y*1.15)):0; out.push(rastYildiz(id,y)); }
  return out;
}

function buffYazi(d){

function gucVer(id,stat,adet){
  const d=DEF[id]; const e=Object.assign({sa:0,ha:0,zs:0,cn:0},d.ek||{}); e[stat]++;
  const key=tbid(id)+'@'+[e.sa,e.ha,e.zs,e.cn].join('.'); const yeni=varyant(key);
  S.inv[id]-=adet; if(S.inv[id]<=0) delete S.inv[id]; S.inv[key]=(S.inv[key]||0)+1;
  ['iyi','kotu'].forEach(k=>{ const dk=S.decks[k]; while(say(dk,id)>(S.inv[id]||0)) dk.splice(dk.indexOf(id),1); });
  return yeni;
}

function satKart(id,n){

function rakipDeste(k,L,boyut){
  const pool=DATA.filter(d=>d.karma===k&&!d.efs&&!d.mini&&!d.cagrilan&&!d.ozel&&d.tur!=='zemin').sort((a,b)=>a.fiyat-b.fiyat);
  const n=pool.length, out=[], sy={};
  const miniSay=L>=4?2:L>=2?1:0; karis(DATA.filter(d=>d.karma===k&&d.mini)).slice(0,miniSay).forEach(d=>{out.push(d.id);sy[d.id]=1;});
  // seviye arttıkça havuzun güçlü ucuna kayar
  const alt=Math.min(n-6,Math.floor((L-1)*n/8)), ust=Math.min(n,Math.ceil(n*(0.55+0.12*L)));
  const p=pool.slice(alt,ust);
  const efsSay=L>=5?2:L>=3?1:0;
  const efs=karis(DATA.filter(d=>d.karma===k&&d.efs&&!d.ozel)).slice(0,efsSay); efs.forEach(d=>{out.push(d.id);sy[d.id]=1;});
  const zem=karis(DATA.filter(d=>d.tur==='zemin'&&d.id!=='z_toprak')).slice(0,Math.min(3,1+Math.floor(L/2))); zem.forEach(d=>out.push(d.id));
  if(L>=2) karis(DATA.filter(d=>d.tur==='koruma')).slice(0,L>=4?2:1).forEach(d=>out.push(d.id));
  let g=0; while(out.length<boyut&&g<2000){g++; const d=p[rnd(p.length)]; if((sy[d.id]||0)<3){sy[d.id]=(sy[d.id]||0)+1; out.push(d.id);} }
  return out;
}

  const sayfalar=txt?[txt]:[].concat(IPUCU[key]); let n=0;
  const c=document.createElement('div'); c.className='coach';

// ---------- hesaplar ----------
function ikiz(s,r,i){ const a=M.board[s][r],id=a[i].id; let x=i,y=i; while(x>0&&a[x-1]&&a[x-1].id===id)x--; while(y<4&&a[y+1]&&a[y+1].id===id)y++; const n=y-x+1; return n>=2?Math.pow(2,n-1):0; }
function bmod(s,r){ const b=M.buffs[s][r]; if(!b) return {}; const d=DEF[b.id]; return (b.sahip===s?d.buff.kendi:d.buff.rakip)||{}; }
function eff(s,r,i){
  const u=M.board[s][r][i], d=DEF[u.id], z=DEF[M.zemin], tw=ikiz(s,r,i), b=bmod(s,r);
  const zc=(z.zm&&z.zm[r])||1;
  const sa=Math.max(0,Math.floor(d.sa*zc)+tw+(b.sa||0)-(u.st.duman?5:0));
  const ha=Math.max(0,d.ha+tw+(b.ha||0));
  const zs=Math.max(0,Math.floor((d.zs+tw+(b.zs||0)-u.az)*(z.zz||1)));
  const max=Math.max(1,d.cn+tw+(b.cn||0));
  return {sa,ha,zs,max,tw,b,zc};
}
function canGuncelle(){
  ['p','o'].forEach(s=>ROWS.forEach(r=>M.board[s][r].forEach((u,i)=>{ if(!u) return;
    const m=eff(s,r,i).max; if(u.pm==null) u.pm=DEF[u.id].cn;
    if(m>u.pm) u.hp+=m-u.pm; else if(m<u.pm) u.hp=Math.max(1,Math.min(u.hp,m));
    u.pm=m; })));
}
function birimler(s){ const a=[]; ROWS.forEach(r=>M.board[s][r].forEach((u,i)=>{ if(u) a.push({s,r,i,u}); })); return a; }
function hedefSatir(s){ for(const r of ROWS) if(M.board[s][r].some(Boolean)) return r; return null; }
const ELLER=['ates','yildirim','su','asit','zehir','isik','duman'];
// saldırıda kullanılacak element (çoklu büyü: hedefe en iyi geleni seçer)
function saldiriEl(d,u,td,t){
  if(d.yt&&d.yt.tip==='coklu'){ let en=null,ep=-99;
    ELLER.forEach(el=>{ if((el==='asit'||el==='zehir')&&u.cdx&&u.cdx[el]>0) return;
      if(citirdakKorur(td,t,el)) return;
      const p=elCarpan(el,td,t); const v=p.imm?-1:p.heal?-2:p.m*10+(el==='asit'||el==='zehir'||el==='ates'?3:0)+(el==='su'&&!t.st.islak?2:0)+(el==='duman'?1:0);
      if(v>ep){ep=v;en=el;} });
    return en||'ates'; }
  return d.el||(d.yt&&{yanma:'ates',dumanli:'duman',zehir_asit:'zehir'}[d.yt.tip])||null;
}
function elCarpan(el,td,t){
  let m=1;
  if(el==='isik'&&(ISIGA_HASSAS.includes(td.koken)||(td.hassas&&td.hassas.includes('isik')))) m*=2;
  else if(el&&el!=='isik'&&td.hassas&&td.hassas.includes(el)) m*=2;
  if(el==='yildirim'&&t.st.islak>0) m*=2;
  const z=DEF[M.zemin]; if(el&&z.zx&&z.zx[el]) m*=z.zx[el];
  const imm=!!(el&&td.bagisik&&td.bagisik.includes(el));
  const heal=!!(el&&((td.emer&&td.emer.includes(el))||(el==='ates'&&['ates','magma'].includes(td.koken))));
  return {m,imm,heal};
}
// Çıtırdak bağışıklığı: yalnızca ateş işler, yanarken her şey işler
const yanikZemin=()=>M&&['z_yangin','z_magma'].includes(M.zemin);
const atesBagisik=d=>['ates','magma'].includes(d.koken)||!!(d.emer&&d.emer.includes('ates'));
function zeminYak(){ if(!yanikZemin()) return; ['p','o'].forEach(s=>birimler(s).forEach(x=>{ if(!atesBagisik(DEF[x.u.id])&&kor(x.u,'ates')!==0) x.u.st.yanma=Math.max(x.u.st.yanma||0,3); })); }
function citirdakKorur(td,t,el){ return td.irk==='citirdak'&&!t.kabuk&&!t.st.yanma&&el!=='ates'&&!yanikZemin(); }
// koruma çarpanı: 0 bağışık, .5 direnç, 1 yok
function kor(u,el){ if(!u||!u.kor||u.kor.el!==el) return 1; if(u.kor.tip==='bagisik') return (el==='ates'&&M&&M.zemin==='z_magma')?.5:0; return .5; }
function korumaKoy(s,id,ts,r,i){
  const u=M.board[ts]&&M.board[ts][r]&&M.board[ts][r][i]; if(!u) return false;
  const k=DEF[id].kor; u.kor={el:k.el,tip:k.tip,id};

  M.grave[s].push(id); sfx('buff'); ciz();

}
function hasarHesap(as,ar,ai,ts,tr,ti,ov){
  const u=M.board[as][ar][ai], t=M.board[ts][tr][ti], d=DEF[u.id], td=DEF[t.id], e=eff(as,ar,ai);
  const el=ov&&ov.el!==undefined?ov.el:saldiriEl(d,u,td,t);
  const ha=ov&&ov.ha!=null?ov.ha:e.ha;
  const p=elCarpan(el,td,t);
  if(citirdakKorur(td,t,el)) return {dmg:0,m:1,el,imm:true};
  if(p.imm) return {dmg:0,m:1,el,imm:true};
  const kk=kor(t,el); if(kk===0&&!p.heal) return {dmg:0,m:1,el,imm:true};
  return {dmg:p.heal?ha*p.m:Math.floor(ha*p.m*kk),m:p.m,el,heal:p.heal,kor:kk<1&&!p.heal};
}

  if(!M||M.bitti||M.turn!=='p') return false;

  if(M.phase==='savas') return !M.bonus && (!KARAKTER(d.tur)||M.round===3||M.bossMac||M.cikmaz) && hedefler(h).length>0;
  return false;
}
function hedefler(h){
  const d=DEF[h.id], out=[];
  if(KARAKTER(d.tur)){ M.board.p[d.tur].forEach((u,i)=>{ if(!u) out.push(document.getElementById(`sl_p_${d.tur}_${i}`)); }); }
  else if(d.tur==='zemin'){ out.push(document.getElementById('zslot')); }
  else if(d.tur==='buff'){ ROWS.forEach(r=>{ if(d.buff.kendi) out.push(document.getElementById(`mod_p_${r}`)); if(d.buff.rakip) out.push(document.getElementById(`mod_o_${r}`)); }); }
  else if(d.tur==='kaldir'){ ROWS.forEach(r=>{ const b=M.buffs.o[r]; if(b&&b.sahip==='o') out.push(document.getElementById(`mod_o_${r}`)); }); }
  else if(d.tur==='temizle'){ ROWS.forEach(r=>{ const b=M.buffs.p[r]; if(b&&b.sahip==='o') out.push(document.getElementById(`mod_p_${r}`)); }); }
  else if(d.tur==='koruma'){ ['p','o'].forEach(s=>birimler(s).forEach(x=>out.push(document.getElementById(`sl_${s}_${x.r}_${x.i}`)))); }
  return out;
}
function vurgula(){
  document.querySelectorAll('.hedef-ok,.hedef,.dost-hedef,.can-act,.secili').forEach(e=>e.classList.remove('hedef-ok','hedef','dost-hedef','can-act','secili'));
  if(!M||M.bitti||M.turn!=='p') return;
  if(M.sec&&M.sec.h!=null){ const h=M.hand.p.find(x=>x.h===M.sec.h); if(h) hedefler(h).forEach(e=>e.classList.add('hedef-ok')); const hk=document.querySelector(`[data-h="${M.sec.h}"]`); if(hk) hk.classList.add('secili'); }
  if(M.phase==='savas'){
    if(M.sec&&M.sec.u){ const {r,i}=M.sec.u; const el=document.querySelector(`[data-u="p_${r}_${i}"]`); if(el) el.classList.add('secili');
      if(M.mod==='sifa'||M.mod==='dua'){ birimler('p').forEach(x=>{const e=document.querySelector(`[data-u="p_${x.r}_${x.i}"]`); if(e) e.classList.add('dost-hedef');}); }
      else if(M.mod==='hipnoz'){ birimler('o').forEach(x=>{ if(M.hip&&M.hip.r===x.r&&M.hip.i===x.i) return; const e=document.querySelector(`[data-u="o_${x.r}_${x.i}"]`); if(e) e.classList.add(M.hip?'hedef':'dost-hedef'); }); if(M.hip){ const e=document.querySelector(`[data-u="o_${M.hip.r}_${M.hip.i}"]`); if(e) e.classList.add('secili'); } }
      else { hedefListesi('p',r,i).forEach(x=>{ const e=document.querySelector(`[data-u="o_${x.r}_${x.i}"]`); if(e) e.classList.add('hedef'); }); } }
    else if(!(M.sec&&M.sec.h!=null)) birimler('p').forEach(x=>{const e=document.querySelector(`[data-u="p_${x.r}_${x.i}"]`); if(e) e.classList.add('can-act');});
  }
}

// ---------- oyuncu girdisi ----------
let sur=null;
function eldenBagla(k){
  const h=+k.dataset.h;
  uzunBas(k,()=>{ if(sur&&sur.basladi) return; const x=M&&M.hand.p.find(x=>x.h===h); if(x&&k.isConnected) kartBilgi(x.id); });
  k.addEventListener('pointerdown',e=>{ surTemizle(); sur={h,k,x0:e.clientX,y0:e.clientY,basladi:false,ghost:null,hedef:null}; try{ k.setPointerCapture(e.pointerId); }catch(_){} });

// sürükleme pencere düzeyinde izlenir: kart yeniden çizilse de takılı kalmaz
function surTemizle(){ document.querySelectorAll('#stage > .ghost').forEach(g=>g.remove()); if(sur&&sur.k) sur.k.style.opacity=''; if(sur&&sur.hedef) sur.hedef.classList.remove('ust'); }
addEventListener('pointermove',e=>{
  const d=sur; if(!d||!M) return; const k=d.k, h=d.h; const dx=e.clientX-d.x0, dy=e.clientY-d.y0;

    if(yat&&dx>-5&&Math.abs(dy)>Math.abs(dx)){ document.getElementById('handwrap').scrollTop-=e.movementY||0; return; }
    const hh=M.hand.p.find(x=>x.h===h); if(!hh||!oynanabilir(hh)) return;
    d.basladi=true; delete k.dataset.uzun; M.sec={h}; onizleGizle(); vurgula();
    d.ghost=k.cloneNode(true); d.ghost.classList.add('ghost'); d.ghost.classList.remove('secili','pasif'); document.getElementById('stage').appendChild(d.ghost); k.style.opacity=.3; }
  const stg=document.getElementById('stage'), st=stg.getBoundingClientRect(), sc=st.width/stg.offsetWidth;
  d.ghost.style.left=(e.clientX-st.left)/sc+'px'; d.ghost.style.top=(e.clientY-st.top)/sc+'px';
  d.ghost.style.display='none'; const alt=document.elementFromPoint(e.clientX,e.clientY); d.ghost.style.display='';
  const t=alt&&alt.closest('.hedef-ok'); if(d.hedef&&d.hedef!==t) d.hedef.classList.remove('ust'); d.hedef=t||null; if(t) t.classList.add('ust');
});
function surBit(iptal){
  const d=sur; sur=null; if(!d) return; const k=d.k, h=d.h;
  if(d.basladi){ if(d.ghost) d.ghost.remove(); surTemizle(); k.style.opacity='';
    if(!iptal&&M&&d.hedef&&d.hedef.isConnected&&d.hedef.classList.contains('hedef-ok')){ d.hedef.classList.remove('ust'); elKartOyna(h,d.hedef); } else if(M){ M.sec=null; vurgula(); eliCiz(); } return; }

addEventListener('pointerup',()=>surBit(false));
addEventListener('pointercancel',()=>surBit(true));
addEventListener('blur',()=>surBit(true));
function onizleGoster(id){ const o=document.getElementById('onizle'); o.innerHTML=onizleHTML(DEF[id]); o.classList.add('on'); }
function onizleGizle(){ document.getElementById('onizle').classList.remove('on'); }

document.getElementById('stage').addEventListener('click',e=>{
  if(!M||M.bitti||document.getElementById('oyun').classList.contains('on')===false) return;
  if(e.target.closest('.modal')||e.target.closest('#handrow')||e.target.closest('.btn')||e.target.closest('.mute')) return;
  if(M.turn!=='p') return;
  const hd=e.target.closest('.hedef-ok')||(()=>{ const uu=e.target.closest('[data-u]'); const sl=uu&&uu.closest('.slot'); return sl&&sl.classList.contains('hedef-ok')?sl:null; })();

  const u=e.target.closest('[data-u]'); if(u&&u.dataset.uzun){ delete u.dataset.uzun; return; }
  if(M.phase==='savas'&&u){

    if(s==='p'){
      if(M.mod==='sifa'||M.mod==='dua'){ yetenekDost(M.sec.u.r,M.sec.u.i,r,+i); return; }
      M.sec={u:{r,i:+i}}; M.mod=null; onizleGizle(); eylemSec(r,+i); vurgula(); durumCiz(); sfx('tik'); return; }
    if(s==='o'&&M.mod==='hipnoz'&&M.sec&&M.sec.u){ if(!M.hip){ M.hip={r,i:+i}; vurgula(); durumCiz(); sfx('tik'); return; }
      if(!(M.hip.r===r&&M.hip.i===+i)){ const a=M.hip; M.hip=null; M.mod=null; M.sec=null; hipnoz('o',a.r,a.i,r,+i); setTimeout(()=>savasTurBitir('p'),700); return; } }
    if(s==='o'&&u.classList.contains('hedef')&&M.sec&&M.sec.u){ const a=M.sec.u; const ov=M.mod==='ates'?{el:'ates',atesBuyu:true}:undefined; M.sec=null; M.mod=null; aksiyonKapat(); saldir('p',a.r,a.i,'o',r,+i,ov); setTimeout(()=>savasTurBitir('p'),650); return; }
  }
  if(!e.target.closest('.kart')){ M.sec=null; M.mod=null; M.hip=null; onizleGizle(); aksiyonKapat(); eliCiz(); vurgula(); durumCiz(); }
});
function aksiyonKapat(){ const a=document.getElementById('actbar'); if(a) a.remove(); }
function eylemSec(r,i){
  aksiyonKapat(); const u=M.board.p[r][i], d=DEF[u.id];
  if(!d.yt||!['sifa','dua','mucize','zombi','hipnoz','atesSecim'].includes(d.yt.tip)) return;

  const hazir=d.yt.tip==='mucize'?(u.cd===0&&mucizeAdaylari().length):d.yt.tip==='zombi'?(u.cd===0&&zombiAdaylari('p').length):true;
  bar.innerHTML=`<button class="btn sm" data-x="saldir">Saldır</button><button class="btn sm iyi" data-x="yt" ${hazir?'':'disabled'}>${ad}${(d.yt.tip==='mucize'||d.yt.tip==='zombi')&&u.cd>0?' ('+u.cd+')':''}</button>`;
  document.getElementById('mid').appendChild(bar);
  bar.querySelector('[data-x=saldir]').onclick=e=>{e.stopPropagation(); M.mod=null; aksiyonKapat(); vurgula(); durumCiz();};
  bar.querySelector('[data-x=yt]').onclick=e=>{e.stopPropagation(); aksiyonKapat();
    if(d.yt.tip==='mucize'){ mucizeSec(r,i); return; }
    if(d.yt.tip==='zombi'){ zombiSec(r,i); return; }
    if(d.yt.tip==='atesSecim'){ M.mod='ates'; vurgula(); durumCiz(); return; }

}
function anaBtn(){ sfx('tik');
  if(M.turn!=='p'||M.bitti) return;
  if(M.phase==='yerlestir'){ hazirim('p'); }
  else if(M.phase==='savas'){ M.sec=null; M.mod=null; aksiyonKapat(); savasTurBitir('p'); }
}

// ---------- kart oynama (iki taraf) ----------
function elKartOyna(h,hedefEl){
  const idx=M.hand.p.findIndex(x=>x.h===h); if(idx<0) return; const hh=M.hand.p[idx];
  if(!oynanabilir(hh)) return;
  const d=DEF[hh.id];
  let ok=false;
  if(KARAKTER(d.tur)){ ok=birimKoy('p',hh.id,hedefEl.dataset.r,+hedefEl.dataset.i); }
  else if(d.tur==='zemin'){ ok=zeminKoy('p',hh.id); }
  else if(d.tur==='buff'){ ok=buffKoy('p',hh.id,hedefEl.dataset.s,hedefEl.dataset.r); }
  else if(d.tur==='koruma'){ ok=korumaKoy('p',hh.id,hedefEl.dataset.s,hedefEl.dataset.r,+hedefEl.dataset.i); }
  else { ok=buffSil('p',hh.id,hedefEl.dataset.s,hedefEl.dataset.r); }
  if(!ok) return;
  M.hand.p.splice(idx,1); M.sec=null; onizleGizle();
  hamleSonrasi('p');
}
function yeniBirim(id){ const d=DEF[id]; return {id,hp:d.cn,az:0,st:{},cd:0,pm:null,kalkan:(d.yt&&d.yt.tip==='kalkan')?2:0,yas:0}; }
function birimKoy(s,id,r,i){ if(M.board[s][r][i]) return false; M.board[s][r][i]=yeniBirim(id); if(yanikZemin()&&!atesBagisik(DEF[id])) M.board[s][r][i].st.yanma=3; sfx('yerlestir'); seslendir(s,'koy'); return true; }
function zeminKoy(s,id){
  if(M.zeminSahip) M.grave[M.zeminSahip].push(M.zemin);
  M.zemin=id; M.zeminSahip=s; sfx('zemin');
  if(id==='z_yagmur') ['p','o'].forEach(x=>birimler(x).forEach(b=>{ delete b.u.st.asit; delete b.u.st.zehir; delete b.u.st.yanma; }));
  zeminYak(); toast(DEF[id].ad); return true;
}
function buffKoy(s,id,hs,r){
  const d=DEF[id]; if(hs===s&&!d.buff.kendi) return false; if(hs!==s&&!d.buff.rakip) return false;
  const eski=M.buffs[hs][r]; if(eski) M.grave[eski.sahip].push(eski.id);
  M.buffs[hs][r]={id,sahip:s}; sfx(hs===s?'buff':'debuff'); return true;
}
function buffSil(s,id,hs,r){
  const b=M.buffs[hs][r]; if(!b) return false;
  M.grave[b.sahip].push(b.id); M.buffs[hs][r]=null; M.grave[s].push(id); sfx('debuff');
  ['p','o'].forEach(x=>{const g=document.getElementById('grave_'+x); g.classList.remove('vurgu'); void g.offsetWidth; g.classList.add('vurgu');});
  return true;
}
function hamleSonrasi(s){
  if(M.phase==='yerlestir'){ M.placed[s]++; ciz(); yerlestirmeSonraki(s); }
  else { M.bonus=true; ciz(); turSonuKontrol(); }
}

// ---------- yerleştirme akışı ----------
function tamDolu(){ return ['p','o'].every(s=>ROWS.every(r=>M.board[s][r].every(Boolean))); }
function yerlestirmeTuru(){
  if(!M||M.bitti) return;
  const s=M.turn;
  if(M.hand[s].length===0||!M.hand[s].some(h=>hedefVarMi(s,h))){ hazirim(s); return; }
  ciz();
  if(s==='o'){ zamanlayiciDur(); setTimeout(aiYerlestir,700+rnd(600)); }
  else { if(M.tut){ if(M.placed.p===0) ipucu('yer'); else if(M.placed.p===2) ipucu('ikiz'); else if(M.placed.p>=4) ipucu('hazir'); } else zamanlayici(30,()=>hazirim('p')); }
}
function hedefVarMi(s,h){ const d=DEF[h.id];
  if(KARAKTER(d.tur)) return M.board[s][d.tur].some(x=>!x);
  if(d.tur==='kaldir') return ROWS.some(r=>{const b=M.buffs[karsi(s)][r]; return b&&b.sahip===karsi(s);});
  if(d.tur==='temizle') return ROWS.some(r=>{const b=M.buffs[s][r]; return b&&b.sahip===karsi(s);});
  return true; }
function yerlestirmeSonraki(prev){
  zamanlayiciDur();
  if(tamDolu()){ savasBaslat(); return; }
  const o=karsi(prev);
  if(!M.ready[o]) M.turn=o; else if(!M.ready[prev]) M.turn=prev; else { savasBaslat(); return; }
  setTimeout(yerlestirmeTuru,250);
}
function hazirim(s){
  if(M.ready[s]||M.phase!=='yerlestir') return;
  M.ready[s]=true; if(!M.first) M.first=s; zamanlayiciDur();
  if(s==='o') toast('Rakip hazır');
  if(M.ready.p&&M.ready.o){ savasBaslat(); return; }
  M.sec=null; onizleGizle();
  yerlestirmeSonraki(s);
}
function zamanlayici(sn,bitince){
  zamanlayiciDur(); let k=sn; const t=document.getElementById('tmr'); t.textContent=k; t.classList.remove('az');
  timerInt=setInterval(()=>{ k--; t.textContent=k; t.classList.toggle('az',k<=10); if(k<=5&&k>0) sfx('tik'); if(k<=0){ zamanlayiciDur(); bitince(); } },1000);
}
function zamanlayiciDur(){ clearInterval(timerInt); timerInt=null; const t=document.getElementById('tmr'); if(t){t.textContent='';t.classList.remove('az');} }

// ---------- savaş akışı ----------
function savasBaslat(){
  zamanlayiciDur(); M.phase='savas'; M.sec=null; onizleGizle();
  M.turn=M.first||(Math.random()<.5?'p':'o');
  ciz(); toast('Savaş!'); seslendirAnl('ANL-04'); ipucu('savas');
  if(turSonuKontrol()) return;
  setTimeout(savasTurBasla,1300);
}
function savasTurBasla(){
  if(!M||M.bitti||M.phase!=='savas') return;
  const s=M.turn; M.bonus=false; M.sec=null; M.mod=null;
  // bekleme süreleri, durum etkileri, zemin etkisi
  zeminYak();
  birimler(s).forEach(x=>{ const u=x.u, d=DEF[u.id];
    if(u.cd>0) u.cd--; if(u.cdx) for(const k in u.cdx) if(u.cdx[k]>0) u.cdx[k]--;
    if(u.st.asit){ const v=Math.floor(4*kor(u,'asit')); u.az+=v; u.st.asit--; yuzen(s,x.r,x.i,'ZS −'+v,'#a8f02a'); if(!u.st.asit) delete u.st.asit; }
    if(u.st.zehir){ const v=Math.floor(4*kor(u,'zehir')); u.hp-=v; u.st.zehir--; yuzen(s,x.r,x.i,'−'+v,'#c48bff'); if(!u.st.zehir) delete u.st.zehir; }
    if(u.st.yanma){ const m=(d.hassas&&d.hassas.includes('ates'))?2:1, v=Math.floor(3*m*kor(u,'ates')); u.hp-=v; u.st.yanma--; yuzen(s,x.r,x.i,'−'+v,'#ff8a3a'); if(!u.st.yanma) delete u.st.yanma; }
    if(d.yagmurIyi&&M.zemin==='z_yagmur'){ const mx=eff(s,x.r,x.i).max; if(u.hp<mx){ u.hp=Math.min(mx,u.hp+d.yagmurIyi); yuzen(s,x.r,x.i,'+'+d.yagmurIyi,'#6fd0ff'); } }
    if(d.yt&&d.yt.tip==='donusum'){ if(u.yas>=1){ u.id='k_kole_bebek_ruhu'; u.hp=DEF['k_kole_bebek_ruhu'].cn; u.pm=null; yuzen(s,x.r,x.i,'Dönüştü!','#c070ff'); } else u.yas++; }
    if(u.st.islak){ u.st.islak--; if(!u.st.islak) delete u.st.islak; }
    const z=DEF[M.zemin];
    if(z.zt){ if(['ates','magma'].includes(d.koken)||(d.emer&&d.emer.includes('ates'))){ u.hp=Math.min(eff(s,x.r,x.i).max,u.hp+z.zt.ates); } else { const v=-Math.floor(-z.zt.diger*kor(u,'ates')); if(v){ u.hp+=v; yuzen(s,x.r,x.i,String(v),'#ff6a3a'); } } }
  });
  olumler();
  if(s==='o'&&M.bossMac) chuanCagir();
  if(M.round===3||M.bossMac) cek(s,1);
  else if(M.cikmaz&&!M.hand[s].some(h=>KARAKTER(DEF[h.id].tur))) cek(s,1);
  ciz(); if(turSonuKontrol()) return;
  if(s==='o') setTimeout(aiSavas,800+rnd(500));
  else { seslendirAnl('ANL-03',25000); if(M.tut&&M.ip.vur&&M.hand.p.some(h=>DEF[h.id].tur==='buff')) ipucu('bonus'); }
}
function savasTurBitir(s){
  if(!M) return; ondeKontrol();
  if(!M||M.bitti||M.phase!=='savas'||M.turn!==s) return;
  if(turSonuKontrol()) return;
  if(M.turdaHasar) M.hasarsiz=0; else M.hasarsiz=(M.hasarsiz||0)+1; M.turdaHasar=false;
  if(!M.cikmaz&&M.hasarsiz>=6){ M.cikmaz=true; toast('Çıkmaz!<br><small style="font-size:12px">Artık savaşta asker çıkarılabilir</small>'); }
  birimler(s).forEach(x=>{ delete x.u.st.duman; });
  M.turn=karsi(s); M.sec=null; M.mod=null; aksiyonKapat(); onizleGizle(); ciz();
  setTimeout(savasTurBasla,350);
}
function olumler(){
  const olen=[];
  ['p','o'].forEach(s=>ROWS.forEach(r=>M.board[s][r].forEach((u,i)=>{ if(u&&u.hp<=0){ M.board[s][r][i]=null; if(!DEF[u.id].cagrilan) M.grave[s].push(u.id); olen.push({s,u}); } })));
  if(!olen.length) return;
  sfx('mezarlik');
  olen.forEach(o=>{ seslendir(karsi(o.s),'oldurdu'); seslendir(o.s,'kaybetti');
    if(o.s==='o'){ M.les=(M.les||0)+lesDegeri(DEF[o.u.id]); M.lesSay=(M.lesSay||0)+1; }
    // Ahmar: daha önce iblis öldürmüş bir kart ölünce Ahmar'ın safına bir İblis gelir
    if(o.u.iblisOldurdu){ ['p','o'].forEach(a=>{ if(birimler(a).some(x=>tbid(x.u.id)==='k_ahmar')){ const sl=M.board[a].buyucu.findIndex(x=>!x);
      if(sl>=0){ M.board[a].buyucu[sl]=yeniBirim('k_iblis'); toast('Ahmar bir İblis çağırdı!'); sfx('zemin'); } } }); }
  });
}
function turSonuKontrol(){
  if(M.phase!=='savas'||M.bitti) return false;
  if(M.bossMac){ const ch=birimler('o').some(x=>x.u.id==='k_chuan_sjin'); if(!ch){ M.wins.p=1; macBitti('p'); return true; }
    if(!birimler('p').length){ elBitti('o'); return true; } return false; }
  const pc=birimler('p').length, oc=birimler('o').length;
  if(pc&&oc) return false;
  elBitti(pc===0&&oc===0?'ikisi':pc===0?'o':'p'); return true;
}
function hipnoz(ts,ar,ai,br,bi){
  // rakibin (ts) ar/ai kartı, yine rakibin br/bi kartına saldırır
  const a=M.board[ts][ar][ai]; if(!a) return;
  toast(cvf('Hipnoz! {0} kendi safına saldırıyor',DEF[a.id].ad)); sfx('debuff');
  saldir(ts,ar,ai,ts,br,bi,{hipnoz:true});
}
function zombiAdaylari(s){ const yer=t=>M.board[s][t==='okcu'?'okcu':'piyade'].some(x=>!x);
  const out=[]; ['p','o'].forEach(g=>[...new Set(M.grave[g])].forEach(id=>{ const d=DEF[id]; if(KARAKTER(d.tur)&&yer(d.tur)) out.push({g,id}); })); return out; }
function zombiSec(r,i){
  const a=zombiAdaylari('p');

function saldiriGoster(as,ar,ai,ts,tr,ti,ek){
  try{
  const st=document.getElementById('stage'), sr=st.getBoundingClientRect(), k=sr.width/st.offsetWidth;
  const a=document.getElementById(`sl_${as}_${ar}_${ai}`), t=document.getElementById(`sl_${ts}_${tr}_${ti}`); if(!a||!t) return;
  const ua=M.board[as][ar][ai], ut=M.board[ts][tr][ti]; if(!ua||!ut) return;
  const rc=el=>{ const b=el.getBoundingClientRect(); return {x:(b.left-sr.left)/k,y:(b.top-sr.top)/k,w:b.width/k,h:b.height/k}; };
  const A=rc(a), T=rc(t); const dost=as==='p'&&!(ek&&ek.hipnoz);
  const kat=document.createElement('div'); kat.className='atkkat';
  const renk=dost?'#5ab0ff':'#ff4a3a';
  kat.innerHTML=`<svg viewBox="0 0 ${st.offsetWidth} ${st.offsetHeight}"><defs><marker id="ok${uid}" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${renk}"/></marker></defs>
    <line x1="${A.x+A.w/2}" y1="${A.y+A.h/2}" x2="${T.x+T.w/2}" y2="${T.y+T.h/2}" stroke="${renk}" stroke-width="3" marker-end="url(#ok${uid})"/></svg>
    <div class="atkkut ${dost?'dost':''}" style="left:${A.x-2}px;top:${A.y-2}px;width:${A.w}px;height:${A.h}px"></div>
    <div class="atkkut hedefk" style="left:${T.x-2}px;top:${T.y-2}px;width:${T.w}px;height:${T.h}px"></div>
    <div class="atkyazi ${dost?'dost':''}">${ek&&ek.hipnoz?'Hipnoz: ':''}${dost?'':'Rakip · '}${DEF[ua.id].ad} ➜ ${DEF[ut.id].ad}</div>`;
  st.appendChild(kat); setTimeout(()=>{ kat.style.transition='opacity .35s'; kat.style.opacity='0'; setTimeout(()=>kat.remove(),400); },dost?900:1500);
  }catch(e){}

function yuzen(s,r,i,txt,renk){
  const sl=document.getElementById(`sl_${s}_${r}_${i}`); if(!sl) return;
  const st=document.getElementById('stage').getBoundingClientRect(), b=sl.getBoundingClientRect(), k=st.width/document.getElementById('stage').offsetWidth;
  const f=document.createElement('div'); f.className='float'; f.textContent=txt; f.style.color=renk;
  if(txt.length>9){ f.style.fontSize='12px'; f.style.whiteSpace='nowrap'; } f.style.left=Math.max(52,Math.min(document.getElementById('stage').offsetWidth-52,(b.left+b.width/2-st.left)/k))+'px'; f.style.top=((b.top-st.top)/k+10)+'px';
  document.getElementById('stage').appendChild(f); setTimeout(()=>f.remove(),1150);
}
function toast(h){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=h; document.getElementById('stage').appendChild(t); setTimeout(()=>t.remove(),1650); }

// ---------- el / maç sonu ----------
function elBitti(w){
  M.phase='arasi'; zamanlayiciDur();
  if(w==='ikisi'){M.wins.p++;M.wins.o++;} else M.wins[w]++;
  M.rw.push(w);
  const a=M.wins.p,b=M.wins.o,r=M.round;
  let son=null;
  if(r===3||a>=2||b>=2){
    if(a>b) son='p'; else if(b>a) son='o';
    else if(r===2&&M.rw[0]!=='ikisi') son=M.rw[0];
    else son='beraber';
    if(r<3&&a===b&&a<2) son=null;
  }
  ciz(); ipucu('el');
  const msg=w==='ikisi'?'Berabere el! İkinize de puan':w==='p'?'Eli kazandın!':'Eli kaybettin';
  if(w!=='ikisi'){ seslendir(w,'el'); } muzikDurum();
  setTimeout(()=>{
    if(son){ macBitti(son); return; }
    modal(`<h3>${r}. El bitti</h3><p>${msg}<br>Skor: Sen ${a} – ${b} Rakip</p><button class="btn" onclick="modalKapat();sonrakiEl()">${r+1}. Ele geç</button>`,true);
  },900);
}
function sonrakiEl(){
  M.cikmaz=false; M.hasarsiz=0; M.turdaHasar=false;
  M.round++; M.phase='yerlestir'; M.ready={p:false,o:false}; M.first=null; M.placed={p:0,o:0};
  const n=M.round===2?10:5; cek('p',n); cek('o',n);
  M.turn=Math.random()<.5?'p':'o';
  if(M.bossMac){ M.ready.o=true; M.turn='p'; }
  ciz(); toast(M.round+'. El<br><small style="font-size:12px">'+(M.turn==='p'?'Sen başlıyorsun':'Rakip başlıyor')+'</small>');
  seslendirAnl('ANL-05');
  setTimeout(yerlestirmeTuru,1500);
}
// yenilgi ödülü: 1. elde (pes) yok, 2. elde teselli, 3. elde daha fazla
function yenilgiOdulu(L){ if(!M||M.round<=1) return 0; return M.round===2?20+10*L:50+20*L; }
// öldürülen düşman başına altın
function lesDegeri(d){ if(d.cagrilan) return 2; if(d.efs||d.boss) return 25; if(d.mini) return 15; return 5; }
function macBitti(son){
  M.bitti=true; zamanlayiciDur(); ciz();
  const L=M.L; let temel=son==='p'?150+50*L:son==='beraber'?60:yenilgiOdulu(L);
  let yeniAcildi=null;
  if(M.tut){ temel=son==='p'?(S.tut?20:200):0; S.tut=1; }
  else if(M.bossMac){ if(son==='p'){ temel=600; S.chuan=1; } }
  if(!M.tut&&son==='p'&&M.dugum!=null){ const k=M.bossMac?'iyi':M.k; S.temiz[k]=S.temiz[k]||[];
    if(!S.temiz[k].includes(M.dugum)){ S.temiz[k].push(M.dugum); if(!M.bossMac) temel+=50*L; }
    if(M.dugum>=S.harita[k]&&M.dugum+1<HARITA[k].length){ S.harita[k]=M.dugum+1; yeniAcildi=HARITA[k][M.dugum+1]; } }
  // eğitimde leş altını yok; ilk elde pes edilse de öldürülen düşmanların altını verilir
  const lesA=M.tut?0:(M.les||0);
  const altin=temel+lesA;
  S.gold+=altin; kaydet();
  sfx(son==='p'?'zafer':'yenilgi'); if(son==='p'){ seslendirAnl('ANL-06',0,true); setTimeout(()=>seslendir('p','mac'),2600); } else if(son==='o'){ seslendirAnl('ANL-07',0,true); setTimeout(()=>seslendir('o','mac'),3800); }
  modal(`<div class="sonuc"><div class="bas" style="color:${son==='p'?'#f3d98a':son==='beraber'?'#cbbf9f':'#ff8a7a'}">${son==='p'?'ZAFER':son==='beraber'?'BERABERE':'YENİLGİ'}</div>
    <p>Skor: ${M.wins.p} – ${M.wins.o}</p><p style="font-size:15px;color:var(--gold2)"><span class="coin" style="display:inline-block;vertical-align:middle"></span> ${altin?'+'+altin+' altın':'Altın yok'}</p>
    ${altin&&!M.tut?`<p style="font-size:11px;color:#cbbf9f;margin-top:-6px">${son==='p'?'Zafer':son==='beraber'?'Beraberlik':M.round===1?'Pes (el ödülü yok)':M.round===2?'Teselli ödülü':'Direniş ödülü'}: ${temel} · Öldürülen düşmanlar (${M.lesSay||0}): ${lesA}</p>`:''}
    ${son==='o'&&M.round===1&&!M.tut&&!altin?'<p style="font-size:11px;color:#ff9a7a;margin-top:-6px">İlk elde pes edildi, ödül yok.</p>':''}
    ${M.tut?'<p>Eğitim tamamlandı! Artık <b>Oyna</b> menüsünden gerçek maçlara başlayabilirsin.</p>':''}${yeniAcildi?`<p><b style="color:#9fe09a">▲ Yeni seviye açıldı:</b> ${yeniAcildi.ad}</p>`:''}
    <div style="display:flex;gap:8px;justify-content:center">${M.dugum!=null?`<button class="btn" onclick="modalKapat();const k='${M.bossMac?'iyi':M.k}';M=null;haritaAc(k)">Harita</button>`:''}<button class="btn" onclick="modalKapat();M=null;git('menu')">Ana Menü</button></div></div>`,true);
  muzikCal('menu');
}
function geriCekilSor(){
  if(!M||M.bitti||!['yerlestir','savas'].includes(M.phase)) return;
  modal(`<h3>Geri çekil?</h3><p>Bu eli rakibe bırakırsın. Masadaki kartlar olduğu gibi kalır, ${M.round<3?'sonraki ele geçilir.':'maç biter.'}</p><button class="btn sm" onclick="modalKapat();geriCekil()">Geri çekil</button> <button class="btn sm" onclick="modalKapat()">Devam</button>`);
}
function geriCekil(){ if(!M||M.bitti||!['yerlestir','savas'].includes(M.phase)) return; M.sec=null; M.mod=null; aksiyonKapat(); onizleGizle(); toast('Geri çekildin'); elBitti('o'); }
function cikisSor(){ modal(`<h3>Maçtan çık?</h3><p>Maç yenilgi sayılır. ${M.round===1?'İlk elde çıkarsan el ödülü yok, yalnızca öldürdüğün düşmanların altınını alırsın.':'Bu eldeki ödülü ve öldürdüğün düşmanların altınını alırsın.'}</p><button class="btn sm" onclick="modalKapat();M.wins.o=2;macBitti('o')">Çık</button> <button class="btn sm" onclick="modalKapat()">Devam</button>`); }

// ===================== RAKİP YAPAY ZEKÂSI =====================
const aiZeki=()=>Math.min(1,0.45+0.13*M.L);   // seviye arttıkça daha az hata
function aiYerlestir(){
  if(!M||M.bitti||M.phase!=='yerlestir'||M.turn!=='o') return;
  const H=M.hand.o, kota=M.tut?(M.round===3?99:4):M.round===3?99:(M.round===1?5:4)+Math.min(M.L,4);
  const onde=guc('o')-guc('p');
  if(M.placed.o>=kota||(M.ready.p&&onde>8&&M.round<3)){ hazirim('o'); return; }
  const hamle=aiBonusSec(true)||aiAskerSec();
  if(!hamle){ hazirim('o'); return; }
  aiUygula(hamle); hamleSonrasi('o');
}
function aiAskerSec(){
  let en=null;
  M.hand.o.forEach(h=>{ const d=DEF[h.id]; if(!KARAKTER(d.tur)) return; const row=M.board.o[d.tur];
    for(let i=0;i<5;i++){ if(row[i]) continue;
      const kom=(row[i-1]&&row[i-1].id===h.id?1:0)+(row[i+1]&&row[i+1].id===h.id?1:0);
      const sk=d.sa+d.ha+d.zs*.8+d.cn+kom*14+Math.random()*(8*(1-aiZeki()));
      if(!en||sk>en.sk) en={sk,tip:'asker',h,r:d.tur,i}; } });
  return en;
}
function aiBonusSec(yerlestirme){
  const H=M.hand.o; let en=null; const z=aiZeki();
  H.forEach(h=>{ const d=DEF[h.id]; let sk=0,hamle=null;
    if(d.tur==='kaldir'){ ROWS.forEach(r=>{const b=M.buffs.p[r]; if(b&&b.sahip==='p'){ const v=M.board.p[r].filter(Boolean).length*8; if(v>sk){sk=v;hamle={tip:'sil',h,s:'p',r};} }}); }
    else if(d.tur==='temizle'){ ROWS.forEach(r=>{const b=M.buffs.o[r]; if(b&&b.sahip==='p'){ const v=M.board.o[r].filter(Boolean).length*8; if(v>sk){sk=v;hamle={tip:'sil',h,s:'o',r};} }}); }
    else if(d.tur==='buff'){ ROWS.forEach(r=>{
        if(d.buff.kendi&&!M.buffs.o[r]){ const v=M.board.o[r].filter(Boolean).length*6; if(v>sk){sk=v;hamle={tip:'buff',h,s:'o',r};} }
        if(d.buff.rakip&&!(M.buffs.p[r]&&M.buffs.p[r].sahip==='o')){ const v=M.board.p[r].filter(Boolean).length*6; if(v>sk){sk=v;hamle={tip:'buff',h,s:'p',r};} } }); }
    else if(d.tur==='zemin'&&d.id!==M.zemin){ const once=guc('o')-guc('p'); const eski=M.zemin; M.zemin=d.id;
        let sonra=guc('o')-guc('p'); if(d.zt){ birimler('o').forEach(x=>{ sonra+=(['ates','magma'].includes(DEF[x.u.id].koken)?1:-1)*d.zt.ates*3; }); birimler('p').forEach(x=>{ sonra-=(['ates','magma'].includes(DEF[x.u.id].koken)?1:-1)*d.zt.ates*3; }); }
        M.zemin=eski; const v=sonra-once; if(v>6){sk=v;hamle={tip:'zemin',h};} }
    else if(d.tur==='koruma'){ const k=d.kor;
        const tehdit=birimler('p').filter(x=>saldiriEl(DEF[x.u.id],x.u,{},{st:{}})===k.el).length+(k.el==='ates'&&yanikZemin()?2:0);
        if(tehdit){ let en2=null; birimler('o').forEach(x=>{ const dx=DEF[x.u.id]; if(x.u.kor&&x.u.kor.el===k.el&&(x.u.kor.tip==='bagisik'||k.tip==='direnc')) return; if(dx.bagisik&&dx.bagisik.includes(k.el)) return;
            const v=(dx.sa+dx.cn)/3+(dx.hassas&&dx.hassas.includes(k.el)?8:0)+(dx.efs?6:0); if(!en2||v>en2.v) en2={v,x}; });
          if(en2){ sk=tehdit*4+en2.v*(k.tip==='bagisik'?1.2:.8); hamle={tip:'kor',h,r:en2.x.r,i:en2.x.i}; } } }
    else if(KARAKTER(d.tur)&&!yerlestirme&&(M.round===3||M.cikmaz)){ const a=aiAskerSec(); if(a&&a.h===h){sk=12;hamle=a;} }
    if(hamle&&sk>=(yerlestirme?18:8)&&(!en||sk>en.sk)) en=Object.assign(hamle,{sk}); });
  if(en&&Math.random()>z+0.2) return null;
  return en;
}
function aiUygula(a){
  const idx=M.hand.o.indexOf(a.h); if(idx<0) return; M.hand.o.splice(idx,1);
  if(a.tip==='asker') birimKoy('o',a.h.id,a.r,a.i);
  else if(a.tip==='zemin') zeminKoy('o',a.h.id);
  else if(a.tip==='buff') buffKoy('o',a.h.id,a.s,a.r);
  else if(a.tip==='sil') buffSil('o',a.h.id,a.s,a.r);
  else if(a.tip==='kor') korumaKoy('o',a.h.id,'o',a.r,a.i);
}
function aiSavas(){
  if(!M||M.bitti||M.phase!=='savas'||M.turn!=='o') return;
  const b=aiBonusSec(false);
  const devam=()=>{ if(M.bitti||M.phase!=='savas') return; if(turSonuKontrol()) return; aiSaldir(); };
  if(b){ aiUygula(b); M.bonus=true; ciz(); setTimeout(devam,700); } else devam();
}
function aiSaldir(){
  const sec=[]; if(!birimler('p').length){ turSonuKontrol(); return; }
  const r12=()=>Math.random()*12*(1-aiZeki());
  birimler('o').forEach(x=>{ const e=eff('o',x.r,x.i), d=DEF[x.u.id], yt=d.yt&&d.yt.tip;
    if(yt==='sifa'){ birimler('o').forEach(y=>{ const ey=eff('o',y.r,y.i); const eks=ey.max-y.u.hp; if(eks>=6) sec.push({sk:eks*1.5,tip:'sifa',x,y}); }); }
    if(yt==='mucize'&&x.u.cd===0){ const a=mucizeAdaylari('o'); if(a.length){ const en=a.sort((p,q)=>DEF[q].fiyat-DEF[p].fiyat)[0]; sec.push({sk:30+DEF[en].sa,tip:'mucize',x,id:en}); } }
    if(yt==='zombi'&&x.u.cd===0){ const a=zombiAdaylari('o'); if(a.length) sec.push({sk:34+r12(),tip:'zombi',x,z:a[rnd(a.length)]}); }
    if(yt==='hipnoz'){ const P=birimler('p'); let en=null;
      P.forEach(A=>{ const ea=eff('p',A.r,A.i); if(!ea.ha) return; P.forEach(B=>{ if(A===B) return; const eb=eff('p',B.r,B.i); const h=hasarHesap('p',A.r,A.i,'p',B.r,B.i); if(h.imm) return; const dm=ea.sa>=eb.zs?h.dmg:0; const sk=dm>=B.u.hp?55+eb.sa:dm*1.4+ea.ha*.3; if(!en||sk>en.sk) en={sk,A,B}; }); });
      if(en) sec.push({sk:en.sk+r12(),tip:'hipnoz',a:en.A,b:en.B});
      return; }
    if(!e.ha&&!e.sa) return;
    hedefListesi('o',x.r,x.i).forEach(T=>{ const t=T.u, te=eff('p',T.r,T.i);
      let ov=null;
      if(d.yt&&d.yt.tip==='atesSecim'){ const h1=hasarHesap('o',x.r,x.i,'p',T.r,T.i), h2=hasarHesap('o',x.r,x.i,'p',T.r,T.i,{el:'ates'});
        if(!h2.imm&&!h2.heal&&(h1.imm||h2.dmg>h1.dmg||(h2.dmg===h1.dmg&&!t.st.yanma&&!atesBagisik(DEF[t.id])))) ov={el:'ates',atesBuyu:true}; }
      const h=hasarHesap('o',x.r,x.i,'p',T.r,T.i,ov?{el:'ates'}:undefined); if(h.imm){ sec.push({sk:-5,tip:'vur',x,r:T.r,i:T.i}); return; }
      let sk; if(e.sa>=te.zs){ sk=h.dmg>=t.hp?60+te.sa:h.dmg*1.6+te.sa*.3; if(d.yt&&x.u.cd===0) sk+=8; if(h.heal) sk-=20; }
      else sk=e.ha*.15;
      if(DEF[t.id].yt&&DEF[t.id].yt.tip==='chuan') sk+=10;
      if(ov&&!t.st.yanma) sk+=4;
      sec.push({sk:sk+r12(),tip:'vur',x,r:T.r,i:T.i,ov}); }); });
  if(!sec.length){ savasTurBitir('o'); return; }
  sec.sort((a,b)=>b.sk-a.sk); const a=sec[0];
  if(a.tip==='vur'){ saldiriGoster('o',a.x.r,a.x.i,'p',a.r,a.i); setTimeout(()=>{ if(M&&!M.bitti){ saldir('o',a.x.r,a.x.i,'p',a.r,a.i,Object.assign({gosterildi:true},a.ov||{})); setTimeout(()=>savasTurBitir('o'),900); } },700); return; }

}
